function concreteTex(base = 38, var_ = 22, rep = 8) {

  g.fillStyle = `rgb(${base},${base},${base + 2})`; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2600; i++) {
    const x = rnd() * 512, y = rnd() * 512, r = rnd() * 22 + 2, v = base + (rnd() - .5) * var_;

    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();

  for (let i = 0; i < id.data.length; i += 4) { const n = (rnd() - .5) * 14; id.data[i] += n; id.data[i + 1] += n; id.data[i + 2] += n; }

function hallMode(mode, lt = 0) {
  const h = S.hall;
  h.pads.forEach((p, i) => {
    const u = p.userData;
    let on = 1;
    if (mode === 'reveal') on = sstep(i * 0.012, i * 0.012 + .25, lt);
    if (mode === 'solo') on = 0;
    p.visible = mode !== 'solo';
    u.ring.material.emissiveIntensity = 2.2 * on * (0.85 + .15 * Math.sin(lt * 3 + i));

  h.key.intensity = mode === 'solo' ? 0.25 : 1.6;

function symbolTex(k, q = false) {

  g.strokeStyle = '#fff'; g.lineWidth = 3; g.strokeRect(10, 10, 236, 236);
  g.fillStyle = '#fff'; g.strokeStyle = '#fff'; g.lineWidth = 12;
  if (q) { g.font = '300 170px "Inter Display"'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#ff2a2a'; g.fillText('?', 128, 138); }
  else {
    const n = (k % 3) + 1, rot = Math.floor(k / 3);
    g.translate(128, 128); g.rotate(rot * Math.PI / 4);
    for (let i = 0; i < n; i++) { const o = (i - (n - 1) / 2) * 40; g.fillRect(-60, o - 6, 120, 12); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;

// S3 – Die Herausforderungen
shot(17.2, 20.2, (lt) => {
  const ch = S.chamber; ch.doors.forEach((d, i) => { d.leaf.position.z = -7.9; d.cone.material.opacity = .0; d.fm.emissiveIntensity = 3 * (0.6 + .4 * (hash(Math.floor(lt * 12) + i) > .08 ? 1 : 0)); d.sp.intensity = 40; });
  look(vlerp(V(-2.5, 1.5, 7.5), V(1.5, 1.7, 6.5), ease(lt / 3)), V(0, 3, -7), 36);
  return ch.sc;
}, false, (lt) => corner('RUNDE 01 · DREI TÜREN', sstep(.2, .6, lt)));
shot(20.2, 23.2, (lt) => {
  const pz = S.puzzle;
  pz.panels.forEach((p, i) => { p.material.opacity = sstep(i * .22, i * .22 + .2, lt) * (i === 8 ? (0.6 + .4 * Math.sin(lt * 8)) : 1); });
  pz.floorTiles.forEach(({ t, x, z }) => { const ph = (Math.abs(x) + Math.abs(z)) * .12; const on = hash(x * 13 + z * 7) > .72 ? sstep(ph, ph + .3, lt) * (1 - sstep(ph + .6, ph + 1.2, lt)) : 0; t.material.emissiveIntensity = on * .9; });
  const a = lerp(-.5, .35, ease(lt / 3));
  look(V(Math.sin(a) * 9, 2.0 + lt * .2, Math.cos(a) * 9), V(0, 4.2, -2), 38);
  return pz.sc;
}, false, (lt) => corner('RUNDE 02 · DAS MUSTER', sstep(.2, .6, lt)));
shot(23.2, 25.9, (lt) => {
  const o = S.options; o.items.forEach((it, i) => { it.cube.rotation.y = lt * .3 * (i ? 1 : -1); it.cube.position.y = 1.55 + Math.sin(lt * 1.5 + i) * .04; });
  look(vlerp(V(0, 3.0, 9), V(0, 2.6, 6.8), ease(lt / 2.7)), V(0, 1.3, 0), 36);
  return o.sc;
}, false, (lt) => corner('RUNDE 03 · ZWEI OPTIONEN', sstep(.2, .6, lt)));
shot(25.9, 28.6, (lt) => {
  drawCountdown(9.99 - lt * 3.2);
  S.count.rl.intensity = 60 * (0.8 + .2 * Math.sin(lt * 20));
  look(vlerp(V(0, 0.8, 9.5), V(0, 0.85, 7.6), ease(lt / 2.7)).add(shake(lt, .012)), V(0, 3.6, -10), 40);
  return S.count.sc;
}, false, (lt) => corner('RUNDE 04 · ZEIT LÄUFT', sstep(.2, .6, lt)));
shot(28.6, 31.8, (lt) => {
  const tr = S.trust; tr.consoles.forEach((c, i) => { c.b2.material.emissiveIntensity = 5 * (0.5 + .5 * Math.sin(lt * 6 + i * 3)); });
  look(vlerp(V(0, 1.8, 11), V(0, 1.5, 8.5), ease(lt / 3.2)), V(0, 1.2, 0), 34);
  return tr.sc;
}, false, (lt) => {
  corner('RUNDE 05 · VERTRAUEN', sstep(.2, .6, lt));
  centerText('VERTRAUEN ODER VERRATEN?', H - 150, 30, { weight: 500, ls: '12px', a: sstep(1.2, 1.8, lt), family: 'Inter' });
});
// S4 – Die Community
shot(31.8, 38.2, (lt) => {
  drawPhone(lt);
  const g = S.phone.grp;
  g.rotation.set(-.08 + lt * .006, lerp(-.42, -.12, ease(lt / 6.4)), .02);
  look(V(0.3, 0.2, lerp(13, 9.6, ease(lt / 6.4))), V(0.15, 0, 0), 38);
  return S.phone.sc;
});
// Rangliste über der Halle
shot(38.2, 41.0, (lt) => {
  hallMode('all', lt + 5);
  look(vlerp(V(18, 9, 26), V(14, 8, 22), lt / 2.8), V(0, 1, 0), 34);
  return S.hall.sc;
}, false, (lt) => drawBoard(lt));
// Tür B öffnet sich – entschieden von der Community
shot(41.0, 43.4, (lt) => {
  const ch = S.chamber;
  ch.doors.forEach((d, i) => {
    const isB = i === 1; const o = isB ? ease(clamp((lt - .5) / 1.2)) : 0;
    d.leaf.position.z = -7.9 + o * 0.0; d.leaf.position.x = d.x - o * 2.4;
    d.cone.material.opacity = isB ? .07 * o : 0;
    d.fm.emissiveIntensity = isB ? 3 + 4 * o : 1.2;
    d.sp.intensity = isB ? 40 + 60 * o : 12;
  });
  look(vlerp(V(0, 1.6, 9), V(0, 1.7, 7.3), ease(lt / 2.4)), V(0, 3, -7), 36);
  return ch.sc;
}, false, (lt) => {
  const a = sstep(.9, 1.3, lt);
  centerText('ENTSCHEIDUNG DER COMMUNITY', H - 190, 18, { family: '"DejaVu Sans Mono"', weight: 500, ls: '8px', a: a * .9 });
  centerText('TÜR B · 63 %', H - 140, 42, { weight: 600, ls: '10px', a, color: '#ff3a3a', glow: 'rgba(255,40,40,.6)', blur: 24 });
});

// S5 – Das Finale
shot(43.4, 55.0, (lt) => {
  hallMode('solo', lt);
  const h = S.hall;
  const on = sstep(1.0, 1.15, lt) * (lt < 1.6 ? (hash(Math.floor(lt * 30)) > .3 ? 1 : .3) : 1);
  h.redBeam.material.opacity = .028 * on; h.redSpot.intensity = 900 * on; h.redRing.material.emissiveIntensity = 4 * on;
  const k = ease(clamp(lt / 11.6));
  const p = vlerp(V(0, 3.0, 34), V(0, 1.55, 3.4), k);
  look(p.add(shake(lt, .01)), V(0, lerp(4, 1.45, k), 0), lerp(32, 30, k));
  return h.sc;
}, false, (lt) => {
  // Kennung über dem letzten Spieler: Nummer wird zu DU
  const a = sstep(8.6, 9.2, lt) * (1 - sstep(11.0, 11.5, lt));
  if (a > 0) {
    const pp = project(V(0, 1.95, 0));
    const lbl = lt < 9.9 ? 'SPIELER ' + String(Math.floor(hash(Math.floor(lt * 20)) * 9999)).padStart(4, '0') : 'SPIELER: DU';
    tag(pp.x + 10, pp.y, lbl, a, true);
  }
});

// S6 – Markenauftritt
shot(55.0, 60.0, (lt, t) => {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const cut = easeOut(clamp((lt - .25) / .35));
  const fade = 1 - sstep(4.3, 4.95, lt);
  // roter Schnitt
  ctx.save(); ctx.globalAlpha = fade;
  ctx.fillStyle = '#ff1f1f'; ctx.shadowColor = '#ff1f1f'; ctx.shadowBlur = 25;
  ctx.fillRect(W / 2 - 520 * cut, H / 2 + 2, 1040 * cut, 3);
  ctx.restore();
  const ta = sstep(.45, 1.1, lt) * fade;
  const rise = (1 - easeOut(clamp((lt - .45) / .9))) * 18;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H / 2 + 1); ctx.clip();
  centerText('THE FINAL GAME', H / 2 - 70 + rise, 128, { weight: 700, ls: '22px', a: ta, color: '#f2f5fa', glow: 'rgba(200,220,255,.25)', blur: 30, dx: 11 });
  ctx.restore();
  const sa = sstep(1.6, 2.3, lt) * fade;
  centerText('100 PLAYERS. ONE GAME. YOUR DECISION.', H / 2 + 72, 26, { weight: 500, ls: '12px', a: sa, color: '#c6ceda', family: 'Inter', dx: 6 });
  const ca = sstep(2.8, 3.4, lt) * fade;
  centerText('KOMMENTIERE. ENTSCHEIDE. SPIELE MIT.', H / 2 + 230, 16, { weight: 500, ls: '8px', a: ca * .7, family: '"DejaVu Sans Mono"', color: '#ff4a4a', dx: 4 });
}, true);

function drawBoard(lt) {
  const x0 = 1150, y0 = 230, w = 560;
  const a = sstep(.1, .5, lt);
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(4,4,6,.72)'; ctx.fillRect(x0, y0, w, 620);
  ctx.strokeStyle = 'rgba(230,238,255,.35)'; ctx.lineWidth = 1; ctx.strokeRect(x0, y0, w, 620);
  ctx.fillStyle = '#ff2a2a'; ctx.fillRect(x0, y0, 4, 620);
  ctx.fillStyle = '#e9eef7'; ctx.font = '600 22px "Inter Display"'; ctx.letterSpacing = '8px'; ctx.fillText('RANGLISTE', x0 + 40, y0 + 56);
  ctx.fillStyle = '#7d8794'; ctx.font = '500 14px "DejaVu Sans Mono"'; ctx.letterSpacing = '3px'; ctx.fillText('RUNDE 3 · 63 SPIELER VERBLEIBEND', x0 + 40, y0 + 86);
  const rows = [['0042', 940], ['0817', 910], ['0291', 880], ['0007', 860], ['1504', 830], ['2236', 790], ['0613', 760]];
  const after = [['0291', 1020], ['0042', 1010], ['0007', 960], ['0817', 930], ['2236', 900], ['1504', 850], ['0613', 780]];
  const k = ease(clamp((lt - .9) / 1.1));
  rows.forEach(([id, sc0]) => {
    const i0 = rows.findIndex(r => r[0] === id), i1 = after.findIndex(r => r[0] === id);
    const y = y0 + 140 + lerp(i0, i1, k) * 66;
    const s = Math.round(lerp(sc0, after[i1][1], k));
    const hot = id === '0042' || id === '0291';
    ctx.fillStyle = hot ? 'rgba(255,40,40,.10)' : 'rgba(255,255,255,.03)'; ctx.fillRect(x0 + 24, y - 30, w - 48, 52);
    ctx.fillStyle = '#7d8794'; ctx.font = '500 18px "DejaVu Sans Mono"'; ctx.letterSpacing = '2px';
    ctx.fillText(String(Math.round(lerp(i0, i1, k)) + 1).padStart(2, '0'), x0 + 40, y + 3);
    ctx.fillStyle = hot ? '#ff4a4a' : '#e9eef7'; ctx.font = '600 22px "DejaVu Sans Mono"'; ctx.fillText(`SPIELER ${id}`, x0 + 96, y + 4);
    ctx.textAlign = 'right'; ctx.fillStyle = '#e9eef7'; ctx.fillText(String(s), x0 + w - 40, y + 4); ctx.textAlign = 'left';
    if (k > 0 && k < 1 && i1 < i0) { ctx.fillStyle = '#ff4a4a'; ctx.fillText('▲', x0 + w - 140, y + 4); }
  });
  ctx.restore();
}

function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.72)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

window.renderFrame = async (t) => {
  const sh = shots.find(s => t >= s.a && t < s.b) || shots[shots.length - 1];
  const lt = t - sh.a;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  // 2D-only Shots haben keine Szene
  const res = sh.fn(lt, t);
  if (res && res.isScene) {
    const sc = res;
    [S.hall, S.corr, S.door, S.chamber, S.puzzle, S.options, S.count, S.trust, S.phone].forEach(o => o.dust && animDust(o.dust, t));
    rpass.scene = sc;
    composer.render();
    ctx.drawImage(glCanvas, 0, 0, W, H);
    vignette();
    const hudFn = sh.hud; if (hudFn) hudFn(lt);
  }
  // kurze Schwarz-/Lichtblitze an Schnitten
  for (const s of shots) {
    const d = t - s.a;
    if (s.a > 6 && s.a < 55 && d >= 0 && d < 0.06) { ctx.fillStyle = 'rgba(0,0,0,.85)'; ctx.fillRect(0, 0, W, H); }
  }
  // Schlussblende
  if (t > 59.2) { ctx.fillStyle = `rgba(0,0,0,${sstep(59.2, 59.9, t)})`; ctx.fillRect(0, 0, W, H); }
  return out.toDataURL('image/jpeg', 0.93);
};
// HUD-Funktionen zuordnen (4. Argument von shot)
window.ready = document.fonts.ready.then(() => true);
</script></body></html>
