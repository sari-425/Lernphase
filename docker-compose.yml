# Selbstbetrieb auf einem kleinen Server (VPS) – siehe docs/BETRIEB.md
# Start:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: betriebsrat
      POSTGRES_USER: betriebsrat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betriebsrat -d betriebsrat"]
      interval: 10s
      retries: 10
    # bewusst KEIN Port nach außen

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://betriebsrat:${POSTGRES_PASSWORD}@db:5432/betriebsrat
      AUTO_MIGRATE: "true"
      TRUST_PROXY: "true"
      ENABLE_INTERNAL_SCHEDULER: "true"
    depends_on:
      db:
        condition: service_healthy
    # nur intern erreichbar; nach außen nur über Caddy (HTTPS)

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN in .env setzen}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
