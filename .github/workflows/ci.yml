name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit- und Integrationstests (eingebettete DB)
        run: npm test
      - name: Integrationstests gegen PostgreSQL
        run: npm run test:pg
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/brd_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-End-Tests
        run: npm run test:e2e
      - name: Sicherheitsprüfung der Abhängigkeiten
        run: npm audit --omit=dev --audit-level=high
